<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas Pertemuan 5 Javascript - Manajemen Produk</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h2 {
        margin-top: 30px;
      }
      form {
        margin: 10px 0;
      }
      input {
        margin: 5px;
        padding: 5px;
      }
      button {
        margin: 5px;
        padding: 5px 10px;
      }
      ul {
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Tugas Pertemuan 5 Javascript - Manajemen Produk</h1>

    <!-- Form Tambah Produk -->
    <h2>Tambah Produk</h2>
    <form id="formTambah">
      <input type="number" id="idTambah" placeholder="ID Produk" required />
      <input type="text" id="namaTambah" placeholder="Nama Produk" required />
      <input
        type="number"
        id="hargaTambah"
        placeholder="Harga Produk"
        required
      />
      <button type="submit">Tambah</button>
    </form>

    <!-- Form Hapus Produk -->
    <h2>Hapus Produk</h2>
    <form id="formHapus">
      <input type="number" id="idHapus" placeholder="ID Produk" required />
      <button type="submit">Hapus</button>
    </form>

    <!-- Tampilkan Produk -->
    <h2>Daftar Produk</h2>
    <button id="btnTampil">Tampilkan Semua Produk</button>
    <ul id="listProduk"></ul>

    <script>
      // Data Produk
      let produkList = [
        { id: 1, name: "Laptop", price: 12000000 },
        { id: 2, name: "Smartphone", price: 5000000 },
        { id: 3, name: "Tablet", price: 5000000 },
        { id: 4, name: "Monitor", price: 3000000 },
        { id: 5, name: "Keyboard", price: 800000 },
      ];

      // Menampilkan Produk dengan Destructuring
      function tampilkanProduk() {
        const ul = document.getElementById("listProduk");
        ul.innerHTML = ""; // reset isi
        produkList.forEach(({ id, name, price }) => {
          const li = document.createElement("li");
          li.textContent = `ID: ${id} | Nama: ${name} | Harga: Rp${price}`;
          ul.appendChild(li);
        });
      }

      // Menambahkan produk dengan Spread Operator
      function tambahProduk(id, nama, harga) {
        const newProduct = { id, name: nama, price: harga };
        produkList = [...produkList, newProduct];
        alert(`Produk "${nama}" berhasil ditambahkan!`);
      }

      // Menghapus Produk dengan Rest Parameter
      function hapusProduk(...ids) {
        produkList = produkList.filter((produk) => !ids.includes(produk.id));
        alert(`Produk dengan ID ${ids} berhasil dihapus!`);
      }

      // Event Listener tombol tampil
      document
        .getElementById("btnTampil")
        .addEventListener("click", tampilkanProduk);

      // Event Listener form tambah
      document
        .getElementById("formTambah")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const id = parseInt(document.getElementById("idTambah").value);
          const nama = document.getElementById("namaTambah").value;
          const harga = parseInt(document.getElementById("hargaTambah").value);

          tambahProduk(id, nama, harga);
          tampilkanProduk();
          this.reset();
        });

      // Event Listener form hapus
      document
        .getElementById("formHapus")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const id = parseInt(document.getElementById("idHapus").value);
          hapusProduk(id);
          tampilkanProduk();
          this.reset();
        });

      // Tampilkan produk awal
      tampilkanProduk();
    </script>
  </body>
</html>
